<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
</head>
<body>
    <h2>Registration Form</h2>
    <form>
        <table>
            <tr>
                <td>First Name :</td>
                <td>
                    <input type="text" placeholder="Enter First Name">
                </td>
            </tr>

            <tr>
                <td>Last Name :</td>
                <td>
                    <input type="text" placeholder="Enter Last Name">
                </td>
            </tr>

            <tr>
                <td>Email :</td>
                <td>
                    <input type="email" placeholder="Enter Email Address">
                </td>
            </tr>

            <tr>
                <td>Password :</td>
                <td>
                    <input type="password">
                </td>
            </tr>

            <tr>
                <td>Gender:</td>
                <td></td>
            </tr>

            <tr>
                <td>Male</td>
                <td>
                    <input type="radio" name="gender">
                </td>
            </tr>

            <tr>
                <td>Female</td>
                <td>
                    <input type="radio" name="gender">
                </td>
            </tr>

            <tr>
                <td>Other</td>
                <td>
                    <input type="radio" name="gender">
                </td>
            </tr>

            <tr>
                <td>Age :</td>
                <td>
                    <input type="number">
                </td>
            </tr>

            <tr>
                <td>Preferences :</td>
                <td></td>
            </tr>

            <tr>
                <td>Acrylic Painting</td>
                <td>
                    <input type="checkbox">
                </td>
            </tr>

            <tr>
                <td>Oil Painting</td>
                <td>
                    <input type="checkbox">
                </td>
            </tr>

            <tr>
                <td>Water Color Painting</td>
                <td>
                    <input type="checkbox">
                </td>
            </tr>

            <tr>
                <td>Select Occupation</td>
                <td>
                    <select>
                        <option>Student</option>
                        <option>Teacher</option>
                        <option>Engineer</option>
                        <option>Other</option>
                    </select>
                </td>
            </tr>

            <tr>
                <td>Bio</td>
                <td>
                    <textarea rows="8" cols="45"
                        placeholder="Share few lines about yourself..."></textarea>
                </td>
            </tr>

            <tr>
                <td>
                    <input type="reset" value="RESET">
                </td>
                <td>
                    <input type="submit" value="SUBMIT">
                </td>
            </tr>
        </table>
    </form>
</body>
</html>
