<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>FORM DU LIEU</h2>
    <table>
        <form>
            <tr>
                <td>Username</td>
                <td><input type="text"></td>
            </tr>
            <tr>
                <td>Password</td>
                <td><input type="password"></td>
            </tr>
            <tr>
                <td>Wedserver</td>
                <td>
                    <select>
                        <option>Choose a server</option>
                        <option>Vietnam</option>
                        <option>Sing</option>
                        <option>America</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td>Choose a role</td>
                <td>
                    <label><input type="radio" name="role">IT</label> <br>
                    <label><input type="radio" name="role">None IT</label> <br>
                    <label><input type="radio" name="role">Dev</label> <br>
                </td>
            </tr>
            <tr>
                <td>Single sign-on</td>
                <td>
                    <label><input type="checkbox" >Mail</label> <br>
                    <label><input type="checkbox" >Zalo</label> <br>
                    <label><input type="checkbox" >Facebook</label> <br>
                </td>
            </tr>
            <tr>
                <td>
                    <input type="submit" value="Login">
                    <input type="reset" value="reset">
                </td>
            </tr>
        </form>
    </table>
</body>
</html>
