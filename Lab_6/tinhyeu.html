<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>XEM BOI TINH YEU</h2>
    <label for="">Nhap ten ban</label>
    <input type="text" id="tenban">
    <br>
    <label for="">Nhap ten nguoi ay</label>
    <input type="text" id="tennguoiay">
    <br><br>
    <button onclick="xemBoi">Xem ket qua</button>
    <h3 id="ketqua"></h3>

    <script>
        let tenBan = document.getElementById("tenban").value;
        let tenNguoiAy = document.getElementById("tennguoiay").value;
        let diem = Math.floor(Math.random() * 100) + 1;
        if(diem > 50){
            document.getElementById("ketqua").innerHTML= tenBan+ +tenNguoiAy+" hợp nhau "+ diem + ".Chuc mung. Hai ban rat hop nhau"
        }else{
            document.getElementById("ketqua").innerHTML= tenBan+ +tenNguoiAy+" hợp nhau "+ diem + ".lop du phong"
        }
    </script>
</body>
</html>
