<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Profile - Nguyễn Hoàng Huy</title>
  <style>
    body {
      background-color: #eef2f7;
      font-family: "Segoe UI", Arial, sans-serif;
      margin: 0;
    }

    /* Card */
    .card {
      width: 350px;
      max-width: 90%;
      margin: 50px auto;
      padding: 30px 25px;
      border: 2px solid #c5d3e8;
      border-radius: 16px;
      background-color: #ffffff;
      text-align: center;
      box-sizing: border-box;
    }

    /* Avatar */
    .avatar {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      border: 4px solid #2f6fdf;
      margin-bottom: 15px;
    }

    /* Tên và nghề nghiệp */
    .name {
      font-size: 28px;
      color: #1b2a41;
      margin: 0 0 6px;
    }

    .job {
      font-size: 16px;
      font-weight: 600;
      color: #2f6fdf;
      margin: 0 0 18px;
    }

    .intro {
      font-size: 15px;
      line-height: 1.6;
      color: #555;
      margin: 0 0 20px;
    }

    /* Kỹ năng */
    .skills {
      list-style: none;
      padding: 0;
      margin: 0 0 25px;
    }

    .skill {
      display: inline-block;
      background-color: #e3edff;
      color: #1f4fa3;
      padding: 6px 14px;
      margin: 4px;
      border-radius: 20px;
      font-size: 14px;
    }

    /* Nút Liên hệ */
    .btn {
      display: inline-block;
      padding: 10px 28px;
      background-color: #2f6fdf;
      color: #ffffff;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
    }

    .btn:hover {
      background-color: #1b9c6b;
    }
  </style>
</head>
<body>

  <div class="card">
    <!-- Thay src bằng ảnh của bạn, ví dụ "avatar.jpg" -->
    <img class="avatar" alt="Ảnh đại diện"
         src="z7845584540725_a6d1ad31dc37d3edafa4532c1457b793.jpg">

    <h1 class="name">Nguyễn Hoàng Huy</h1>
    <p class="job">Sinh viên Công nghệ thông tin</p>

    <p class="intro">
      Mình là Nguyễn Hoàng Huy
    </p>

    <ul class="skills">
      <li class="skill">HTML</li>
      <li class="skill">CSS</li>
      <li class="skill">JavaScript</li>
      <li class="skill">Python</li>
    </ul>

    <a class="btn" href="huy.2574802011346@vanlanguni.vn">Liên hệ</a>
  </div>
  

</body>
</html>
